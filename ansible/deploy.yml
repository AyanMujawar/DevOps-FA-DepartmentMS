---
# Configures the EC2 server and deploys the app + monitoring stack.
#
# Run by the CI/CD pipeline after every successful push to main, or by hand:
#   export JWT_SECRET=... GRAFANA_ADMIN_PASSWORD=...
#   ansible-playbook -i inventory.ini deploy.yml -e image_tag=<git-sha>
#
# It is idempotent: running it twice changes nothing the second time.

- name: Configure and deploy Campus Connect
  hosts: all
  become: true

  vars:
    repo_url: https://github.com/Nehal-Kongwad/DevOps-FA-DepartmentMS.git
    app_dir: /home/ubuntu/campus-connect
    git_ref: main                          # the pipeline passes the exact commit being deployed
    registry: ghcr.io/nehal-kongwad        # the pipeline passes the registry the images were pushed to
    image_tag: latest                      # the pipeline passes the git-sha tag of the tested images
    compose_files: "-f docker-compose.yml -f docker-compose.monitoring.yml"
    public_host: "{{ inventory_hostname }}"   # address users open in the browser (used for the CORS allow-list)
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
    registry_user: "{{ lookup('env', 'REGISTRY_USER') }}"
    registry_token: "{{ lookup('env', 'REGISTRY_TOKEN') }}"

  tasks:

    - name: Make sure the required secrets were provided
      ansible.builtin.assert:
        that:
          - jwt_secret | length >= 16
          - grafana_admin_password | length > 0
        fail_msg: "Set JWT_SECRET (16+ characters) and GRAFANA_ADMIN_PASSWORD as environment variables"

    - name: Update package list
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Update package list after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add the ubuntu user to the docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    # A small cloud instance running MongoDB + Node + nginx + monitoring can run low on memory under
    # load. A swap file gives the kernel breathing room instead of the OOM killer stopping services.
    # This task is idempotent (checks first, safe to run on every deploy).
    - name: Check if a swap file already exists
      ansible.builtin.stat:
        path: /swapfile
      register: swap_file_check

    - name: Create a 2 GB swap file
      ansible.builtin.command: fallocate -l 2G /swapfile
      when: not swap_file_check.stat.exists

    - name: Set swap file permissions
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'
      when: not swap_file_check.stat.exists

    - name: Format the swap file
      ansible.builtin.command: mkswap /swapfile
      when: not swap_file_check.stat.exists

    - name: Enable the swap file
      ansible.builtin.command: swapon /swapfile
      when: not swap_file_check.stat.exists

    - name: Make swap permanent across reboots
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Fetch the project files (compose files + monitoring config) at the deployed commit
      become_user: ubuntu
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ git_ref }}"
        force: true

    # The .env file holds the real secrets. It is created on the server only - never stored in git.
    - name: Write the .env file with secrets and the image tag to deploy
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Log in to the container registry so the server can pull the images
      ansible.builtin.shell: echo "{{ registry_token }}" | docker login ghcr.io -u "{{ registry_user }}" --password-stdin
      no_log: true
      when: registry_token | length > 0
      changed_when: false

    # Pull everything first (the tested app images and the monitoring images), so downloading and unpacking
    # images is not happening while the containers are starting.
    - name: Pull all images (the tested app images and the monitoring images)
      ansible.builtin.command: docker compose {{ compose_files }} pull
      args:
        chdir: "{{ app_dir }}"
      changed_when: false

    # Start in two stages so a small server is never asked to start every container at the same moment.
    - name: Start the application containers first - nothing is built on the server
      ansible.builtin.command: docker compose {{ compose_files }} up -d --no-build --remove-orphans mongodb backend frontend proxy
      args:
        chdir: "{{ app_dir }}"

    - name: Wait until the API reports it is ready (MongoDB connected)
      ansible.builtin.uri:
        url: http://localhost/api/ready
        status_code: 200
      register: ready_check
      retries: 30
      delay: 5
      until: ready_check.status == 200

    - name: Start the monitoring containers
      ansible.builtin.command: docker compose {{ compose_files }} up -d --no-build
      args:
        chdir: "{{ app_dir }}"

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker compose {{ compose_files }} ps
        chdir: "{{ app_dir }}"
      register: compose_status
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        var: compose_status.stdout_lines
